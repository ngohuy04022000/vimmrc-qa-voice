services:
  vimmrc-qa-voice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vimmrc-qa-voice
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:8000"
    environment:
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=cpu
      - TTS_ENGINE=matcha
      - MRC_CHECKPOINT=/app/mrc-model_Huy/checkpoints/vit5-combined-cont
      - TRANSFORMERS_NO_TF=1
      - QA_INDEX=/app/data/vimmrc_index.json
    volumes:
      - ./data:/app/data:ro
      - ./text-to-speech_Duy/outputs:/app/text-to-speech_Duy/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
