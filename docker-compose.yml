services:
  vimmrc-qa-voice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vimmrc-qa-voice
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:8000"
    environment:
      - WHISPER_DEVICE=cpu
      - TTS_ENGINE=matcha
      - MRC_CHECKPOINT=/app/mrc-model_Huy/checkpoints/vit5-combined-cont
      - TRANSFORMERS_NO_TF=1
      # torch defaults to one thread per core; on a shared CPU that oversubscribes
      # and ViT5 answers took 25-300 s instead of ~4 s (measured 20 vs 4 threads)
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - QA_INDEX=/app/data/kb_index.json
      - KB_WIKI=/app/data/kb_wiki_full
      - KB_WIKI_RATIO=0.5
    volumes:
      - ./data:/app/data:ro
      - ./text-to-speech_Duy/outputs:/app/text-to-speech_Duy/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
